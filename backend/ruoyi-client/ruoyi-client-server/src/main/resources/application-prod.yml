--- # MyBatis Plus 生产配置
mybatis-plus:
  sql-log:
    enabled: false
    output: console

--- # Client 业务数据源，与 Admin 共享业务数据
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: ${CLIENT_DB_URL}
          username: ${CLIENT_DB_USERNAME}
          password: ${CLIENT_DB_PASSWORD}
      hikari:
        maxPoolSize: ${CLIENT_DB_MAX_POOL_SIZE:20}
        minIdle: ${CLIENT_DB_MIN_IDLE:10}
        connectionTimeout: 30000
        validationTimeout: 5000
        idleTimeout: 600000
        maxLifetime: 1800000
        keepaliveTime: 30000

--- # Client 会话使用独立 Redis database
spring.data:
  redis:
    host: ${CLIENT_REDIS_HOST}
    port: ${CLIENT_REDIS_PORT:6379}
    database: 1
    password: ${CLIENT_REDIS_PASSWORD}
    timeout: 10s
    ssl.enabled: ${CLIENT_REDIS_SSL:false}

redisson:
  keyPrefix: client
  threads: 16
  nettyThreads: 32
  singleServerConfig:
    clientName: RuoYi-Client
    connectionMinimumIdleSize: 32
    connectionPoolSize: 64
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 50

--- # Client 会话签名密钥，生产环境必须独立配置
sa-token:
  jwt-secret-key: ${CLIENT_JWT_SECRET}

sms:
  # 产品短信能力默认关闭，启用时必须同时配置供应商凭据
  enabled: ${CLIENT_SMS_ENABLED:false}
  config-type: yaml
  restricted: true
  minute-max: 1
  account-max: 30
  blends:
    config1:
      supplier: ${CLIENT_SMS_SUPPLIER:alibaba}
      access-key-id: ${CLIENT_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${CLIENT_SMS_ACCESS_KEY_SECRET:}
      signature: ${CLIENT_SMS_SIGNATURE:}
      sdk-app-id: ${CLIENT_SMS_SDK_APP_ID:}
