name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/init/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/init/**'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile Admin and Client boundaries
        run: ./mvnw -B -pl ruoyi-admin,ruoyi-client -am -DskipTests compile
