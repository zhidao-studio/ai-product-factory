schema_version: "1.0"

preset:
  id: "ai-product-factory-governance"
  name: "AI Product Factory Governance"
  version: "1.0.0"
  description: "Demand-first gates for Spec Kit workflows in ai-product-factory."
  author: "zhidao-studio"
  repository: "https://github.com/zhidao-studio/ai-product-factory"
  license: "MIT"

requires:
  speckit_version: ">=0.16.3,<0.17.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Keep feature specifications focused on business needs."
      strategy: "replace"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Limit clarification to material business decisions."
      strategy: "replace"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Require a confirmed specification and generate design artifacts only when needed."
      strategy: "replace"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Require a confirmed plan and trace tasks to accepted requirements."
      strategy: "replace"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Enforce traceability and scope review before implementation."
      strategy: "replace"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Require explicit implementation authorization and clean analysis."
      strategy: "replace"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Reconcile implementation evidence without bypassing task review."
      strategy: "replace"
    - type: "command"
      name: "speckit.taskstoissues"
      file: "commands/speckit.taskstoissues.md"
      description: "Create GitHub issues only from confirmed tasks with explicit write authorization."
      strategy: "replace"

tags:
  - "requirements"
  - "governance"
  - "demand-first"
