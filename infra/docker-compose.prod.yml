services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ry-vue
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - mysql-prod-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass '$${REDIS_PASSWORD}'"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  admin-backend:
    build:
      context: ../backend
      dockerfile: ruoyi-admin/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_SSL: "false"
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  client-backend:
    build:
      context: ../backend
      dockerfile: ruoyi-client/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_SSL: "false"
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      CLIENT_REDIS_DATABASE: 1
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:-}
      WECHAT_MINI_APP_SECRET: ${WECHAT_MINI_APP_SECRET:-}
      CLIENT_SMS_CONFIG_ID: ${CLIENT_SMS_CONFIG_ID:-config1}
      CLIENT_SMS_TEMPLATE_ID: ${CLIENT_SMS_TEMPLATE_ID:-}
      CLIENT_API_ENCRYPT_ENABLED: ${CLIENT_API_ENCRYPT_ENABLED:-true}
      CLIENT_API_RESPONSE_PUBLIC_KEY: ${CLIENT_API_RESPONSE_PUBLIC_KEY:?set CLIENT_API_RESPONSE_PUBLIC_KEY}
      CLIENT_API_REQUEST_PRIVATE_KEY: ${CLIENT_API_REQUEST_PRIVATE_KEY:?set CLIENT_API_REQUEST_PRIVATE_KEY}
      JAVA_OPTS: ${CLIENT_JAVA_OPTS:--Xms256m -Xmx768m}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/admin.nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - admin-backend
    ports:
      - "8080:80"

  client-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/client.nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client-backend
    ports:
      - "8082:80"

  admin:
    build: ../web/admin
    restart: unless-stopped
    depends_on:
      - admin-gateway
    ports:
      - "8000:80"

  h5:
    build: ../web/h5
    restart: unless-stopped
    depends_on:
      - client-gateway
    ports:
      - "8081:80"

volumes:
  mysql-prod-data:
  redis-prod-data:
