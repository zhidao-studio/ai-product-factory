worker_processes auto;

events {
    worker_connections 2048;
}

http {
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # TLS 在可信上游终止时保留原始协议；直连时使用本 Gateway 的协议。
    map $http_x_forwarded_proto $gateway_forwarded_proto {
        ''      $scheme;
        default $http_x_forwarded_proto;
    }

    # Gateway 只接受可信 TLS 入口流量，由入口覆盖 X-Forwarded-For 后取首个客户端地址。
    map $http_x_forwarded_for $gateway_client_ip {
        "~^\s*(?<first_forwarded_for>[^,\s]+)" $first_forwarded_for;
        default                              $remote_addr;
    }

    limit_req_zone $gateway_client_ip zone=client_login:10m rate=10r/m;
    limit_req_zone $gateway_client_ip zone=client_captcha:10m rate=30r/m;
    limit_req_zone $gateway_client_ip zone=client_sms:10m rate=5r/m;
    limit_req_zone $gateway_client_ip zone=client_api:10m rate=30r/s;

    log_format gateway '$remote_addr [$time_local] "$request" $status '
                       'client_ip=$gateway_client_ip request_id=$request_id upstream=$upstream_addr';

    upstream client_backend {
        server client-backend:8082;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        # TLS 在上游终止，重定向必须保留相对 Location，避免按容器内 HTTP 生成绝对地址。
        absolute_redirect off;
        client_max_body_size 20m;
        limit_req_status 429;
        access_log /var/log/nginx/access.log gateway;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /gateway/health {
            default_type text/plain;
            return 200 'ok';
        }

        # 内部管理接口不属于任何对外 Client 路由。
        location = /internal {
            return 404;
        }

        location ^~ /internal/ {
            return 404;
        }

        location = /prod-api/internal {
            return 404;
        }

        location ^~ /prod-api/internal/ {
            return 404;
        }

        location = /prod-api {
            return 308 /prod-api/;
        }

        location /prod-api/ {
            rewrite ^/prod-api(/.*)$ $1 last;
        }

        location = /auth/login {
            limit_req zone=client_login burst=5 nodelay;
            include /etc/nginx/proxy_params;
            proxy_pass http://client_backend;
        }

        location = /auth/code {
            limit_req zone=client_captcha burst=10 nodelay;
            include /etc/nginx/proxy_params;
            proxy_pass http://client_backend;
        }

        location = /resource/sms/code {
            limit_req zone=client_sms burst=2 nodelay;
            include /etc/nginx/proxy_params;
            proxy_pass http://client_backend;
        }

        location = /auth/logout {
            include /etc/nginx/proxy_params;
            proxy_pass http://client_backend;
        }

        location /client/ {
            limit_req zone=client_api burst=60 nodelay;
            include /etc/nginx/proxy_params;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_pass http://client_backend;
        }

        location / {
            return 404;
        }
    }
}
