events { worker_connections 2048; }

http {
    limit_req_zone $binary_remote_addr zone=client_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=client_api:10m rate=30r/s;

    log_format gateway '$remote_addr [$time_local] "$request" $status '
                       'request_id=$request_id upstream=$upstream_addr';

    upstream client_service {
        server client-backend:8082;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 20m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location /client-auth/ {
            limit_req zone=client_auth burst=10 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_pass http://client_service;
        }

        location /client-resource/ {
            limit_req zone=client_auth burst=10 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_pass http://client_service;
        }

        location /client-api/ {
            limit_req zone=client_api burst=60 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 300s;
            proxy_pass http://client_service;
        }

        location = /health {
            proxy_pass http://client_service/actuator/health;
        }

        location / {
            return 404;
        }
    }
}
