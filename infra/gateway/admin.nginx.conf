worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # TLS 在可信上游终止时保留原始协议；直连时使用本 Gateway 的协议。
    map $http_x_forwarded_proto $gateway_forwarded_proto {
        ''      $scheme;
        default $http_x_forwarded_proto;
    }

    # Gateway 只接受可信 TLS 入口流量，由入口覆盖 X-Forwarded-For 后取首个客户端地址。
    map $http_x_forwarded_for $gateway_client_ip {
        "~^\s*(?<first_forwarded_for>[^,\s]+)" $first_forwarded_for;
        default                              $remote_addr;
    }

    log_format gateway '$remote_addr [$time_local] "$request" $status '
                       'client_ip=$gateway_client_ip request_id=$request_id upstream=$upstream_addr';

    upstream admin_backend {
        server admin-backend:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        # TLS 在上游终止，重定向必须保留相对 Location，避免按容器内 HTTP 生成绝对地址。
        absolute_redirect off;
        client_max_body_size 20m;
        access_log /var/log/nginx/access.log gateway;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;

        location = /gateway/health {
            default_type text/plain;
            return 200 'ok';
        }

        # 内部管理接口仅允许 Admin Backend 通过容器内部网络直连 Client Backend。
        location = /internal {
            return 404;
        }

        location ^~ /internal/ {
            return 404;
        }

        location = /prod-api/internal {
            return 404;
        }

        location ^~ /prod-api/internal/ {
            return 404;
        }

        location = /prod-api {
            return 308 /prod-api/;
        }

        location /prod-api/ {
            rewrite ^/prod-api(/.*)$ $1 break;
            include /etc/nginx/proxy_params;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_pass http://admin_backend;
        }

        location / {
            return 404;
        }
    }
}
